name: admin

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/shared/**"
      - "package-lock.json"
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/shared/**"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Build Next.js
        run: npm run build --workspace=admin
