name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verificar monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@gimnasio/shared

      - name: Test API
        run: npm run test --workspace=api

      - name: Build API
        run: npm run build --workspace=api

      - name: Build admin
        run: npm run build --workspace=admin

      - name: Build web
        run: npm run build --workspace=web
