name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "package-lock.json"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "package-lock.json"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build --workspace=api

      - name: Test
        run: npm run test --workspace=api
        env:
          DATABASE_URL: postgresql://usuario:password@localhost:5432/gimnasio
